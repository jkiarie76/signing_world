          # -------------------------------------------------
          # CONTACT
          # -------------------------------------------------

          - name: contact
            label: Contact
            widget: object
            fields:

              - name: email
                label: Email
                widget: string

              - name: phone
                label: Phone
                widget: string

              - name: location
                label: Location
                widget: string


          # -------------------------------------------------
          # HEADER
          # -------------------------------------------------

          - name: header
            label: Header
            widget: object
            fields:

              - name: logo
                label: Logo
                widget: object
                fields:

                  - name: src
                    label: Logo
                    widget: image

                  - name: alt
                    label: Alt Text
                    widget: string

              - name: siteName
                label: Site Name
                widget: string

              - name: tagline
                label: Tagline
                widget: string


          # -------------------------------------------------
          # DEAF CULTURE SECTIONS
          # -------------------------------------------------

          - name: deafCultureSections
            label: Deaf Culture Sections
            widget: object
            fields:

              - name: etiquette
                label: Etiquette
                widget: object
                fields:

                  - name: eyebrow
                    label: Eyebrow
                    widget: string

                  - name: title
                    label: Title
                    widget: string

                  - name: intro
                    label: Introduction
                    widget: text


  # =======================================================
  # CONNECT PAGE
  # =======================================================

  - name: connect
    label: Connect Page
    icon: connect_without_contact
    label_singular: Connect Page

    files:

      - name: connectPage
        label: Connect
