          - name: contact
            label: Contact
            widget: object
            fields:

              - name: eyebrow
                label: Eyebrow
                widget: string

              - name: title
                label: Title
                widget: string

              - name: description
                label: Description
                widget: text

              - name: phone
                label: Phone
                widget: string

              - name: email
